[package]
name = "imagineone-frame"
version = "0.2.0"
description = "Imagine One IT - desktop app"
authors = ["Imagine One IT"]
edition = "2021"
publish = false

[lib]
name = "imagineone_frame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable = several webviews in one window: our title bar above the ImagineOne web app.
tauri = { version = "2", features = ["unstable", "image-png", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# native-tls: the Windows certificate store, same trust as WebView2.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
url = "2"
sha1_smol = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }

[target.'cfg(windows)'.dependencies]
# "Remember me": Windows data protection (DPAPI), readable only by this Windows user.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
