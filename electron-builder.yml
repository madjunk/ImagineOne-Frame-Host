appId: it.imagineone.frame
productName: Imagine One IT
copyright: Copyright © 2026 Imagine One IT
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: build/icon.png
    to: icon.png
  # Optional per-customer lock: drop a frame-config.json in resources/ before
  # building to ship an installer pre-configured with { baseUrl, tenantSlug }.
  - from: resources/frame-config.json
    to: frame-config.json
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Code signing: set WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD env vars (or use
  # azureSignOptions) — unsigned builds trigger SmartScreen warnings.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Imagine One IT
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ImagineOne-Setup.${ext}  # stable name: /releases/latest/download/ImagineOne-Setup.exe

mac:
  target:
    - target: dmg
      arch: [universal]
  icon: build/icon.png  # electron-builder generates the .icns from this 1024px PNG
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization: set APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID and
  # CSC_LINK / CSC_KEY_PASSWORD (Developer ID Application cert) in the env.
  notarize: false
dmg:
  artifactName: ImagineOne-${version}-${arch}.${ext}

publish:
  provider: github
  owner: madjunk
  repo: ImagineOne-Frame-Host
  releaseType: release
